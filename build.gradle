plugins {
    id "java"
    id "java-library"
    id "java-gradle-plugin"
    id "maven-publish"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Configure the Gradle plugin - disable automatic marker generation
// We'll create our own marker that points to the standalone plugin artifact
gradlePlugin {
    automatedPublishing = false
    plugins {
        deployGuard {
            id = 'com.adambots.deploy-guard'
            implementationClass = 'com.adambots.lib.gradle.DeployGuardPlugin'
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = ""

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    // Gradle API for plugin development
    compileOnly gradleApi()

    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
//
// NOTE: The JAR will only include:
//   - Compiled .class files from src/main/java/
//   - Runtime dependencies
//   - Backup copies of source code and build files
//
// The following folders are EXCLUDED from the JAR:
//   - docs/ (documentation - not needed at runtime)
//   - tests/ (test/example programs - not part of library)
jar {
    // Exclude Gradle API from fat jar - it's only needed at build time for the plugin
    def gradleApiJars = configurations.compileClasspath.filter { it.name.contains('gradle') }
    from {
        (configurations.runtimeClasspath - gradleApiJars).collect { it.isDirectory() ? it : zipTree(it) }
    }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }

    // Explicitly exclude docs and tests from JAR (they're not in src/ so already excluded,
    // but making it explicit for clarity)
    exclude 'docs/**'
    exclude 'tests/**'
    // Exclude Gradle API classes - they're provided by Gradle at plugin runtime
    exclude 'org/gradle/**'

    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

// Create a minimal plugin-only JAR (no dependencies)
task pluginJar(type: Jar) {
    archiveBaseName = 'deploy-guard'
    archiveClassifier = ''  // No classifier - just deploy-guard-VERSION.jar
    from(sourceSets.main.output) {
        include 'com/adambots/lib/gradle/**'
        include 'META-INF/gradle-plugins/**'
    }
}

// Maven Publishing Configuration
publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'AdambotsLib-java'
            version = project.version

            from components.java

            pom {
                name = 'AdambotsLib'
                description = project.description
                url = 'https://github.com/Adambots-245/AdambotsLib'
            }
        }

        // Standalone plugin publication with NO dependencies
        deployGuardPlugin(MavenPublication) {
            groupId = 'com.adambots'
            artifactId = 'deploy-guard'
            version = project.version

            artifact(pluginJar)

            pom {
                name = 'DeployGuard'
                description = 'Gradle plugin to prevent deploying robot code from unauthorized git branches'
                url = 'https://github.com/Adambots-245/AdambotsLib'
                packaging = 'jar'
                // No dependencies - plugin only uses Gradle API which is provided
            }
        }

        // Plugin marker - allows `plugins { id 'com.adambots.deploy-guard' }` syntax
        deployGuardPluginMarker(MavenPublication) {
            groupId = 'com.adambots.deploy-guard'
            artifactId = 'com.adambots.deploy-guard.gradle.plugin'
            version = project.version

            pom {
                name = 'DeployGuard Plugin Marker'
                description = 'Plugin marker for com.adambots.deploy-guard'
                packaging = 'pom'

                withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    def depNode = dependenciesNode.appendNode('dependency')
                    depNode.appendNode('groupId', 'com.adambots')
                    depNode.appendNode('artifactId', 'deploy-guard')
                    depNode.appendNode('version', project.version)
                }
            }
        }
    }
    repositories {
        maven {
            name = 'local'
            url = "${buildDir}/maven"
        }
        maven {
            name = 'docs'
            url = "${projectDir}/docs/maven"
        }
    }
}

// Task to publish to docs folder for GitHub Pages
task publishToGitHubPages {
    dependsOn 'publishMavenPublicationToDocsRepository'
    doLast {
        println "Published to docs/maven - commit and push to update GitHub Pages"
    }
}

// Task to generate/update the vendordep JSON file
task generateVendordep {
    doLast {
        def vendordepFile = file("${projectDir}/AdambotsLib.json")
        def vendordepContent = """{
    "fileName": "AdambotsLib.json",
    "name": "AdambotsLib",
    "version": "${project.version}",
    "uuid": "245a0b0a-d4f5-4c3e-9f1a-2458bcd245ab",
    "frcYear": "2026",
    "mavenUrls": [
        "${project.publishUrl}"
    ],
    "jsonUrl": "https://raw.githubusercontent.com/Adambots-245/AdambotsLib/main/AdambotsLib.json",
    "javaDependencies": [
        {
            "groupId": "${project.group}",
            "artifactId": "AdambotsLib-java",
            "version": "${project.version}"
        }
    ],
    "jniDependencies": [],
    "cppDependencies": []
}
"""
        vendordepFile.text = vendordepContent
        println "Generated vendordep file at: ${vendordepFile.absolutePath}"
    }
}

// Make generateVendordep run before build
build.dependsOn generateVendordep
